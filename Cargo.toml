[package]
name = "nimbus"
version = "0.1.0"
edition = "2021"
description = "Self-hosted cloud saves for PC games, built on Ludusavi"
license = "MIT"
repository = "https://github.com/t0mbi/nimbus"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
arboard = "3"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
