[package]
name = "nimbus"
version = "0.1.0"
edition = "2021"
description = "Self-hosted cloud saves for PC games, built on Ludusavi"
license = "MIT"
repository = "https://github.com/t0mbi/nimbus"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
arboard = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
